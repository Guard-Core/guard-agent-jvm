name: Release

# Publishes guard-agent-jvm to Maven Central (Central Portal) for a release tag.
# Nothing is built or tested for validation here: the tagged commit must
# already have passed the push workflows listed in REQUIRED_WORKFLOWS (ci.yml
# runs the build and tests against the pinned engine, and the dependency
# audit). A release can therefore never fail on a check its pull request did
# not run.
#
# Release-time facts that cannot be known earlier stay here as their own job:
# pre-flight refuses to publish unless BOTH engine artifacts
# (com.guard-core:guard-core-engine and com.guard-core:guard-core at the
# lockstep version pinned in gradle/libs.versions.toml) are live on Maven
# Central. The publish job builds with
# GUARD_CORE_USE_COMPOSITE=false, where the build itself resolves the facade
# coordinates (compile-only) from the repositories; the published POM stays
# engine-free at runtime.
#
# Re-drive: run this workflow by hand (Actions > Release > Run workflow) with
# the tag, for example v3.2.4. It checks out that tag, so a fixed workflow
# on master can publish an existing tag. An artifact already on Maven Central
# is skipped. Bare vX.Y.z tags only. Deployments upload as USER_MANAGED:
# release the VALIDATED deployment from the Portal UI (docs/release.md).

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v3.2.4'
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REQUIRED_WORKFLOWS: >-
    .github/workflows/ci.yml

jobs:
  verify:
    name: Tagged commit passed CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not of the form v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The project version in build.gradle.kts is the source of truth. The
      # tag must equal it, and a SNAPSHOT version here means the release PR
      # forgot the flip (docs/release.md, version-flip checklist).
      - name: Verify the tag equals the project version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 'version = "' build.gradle.kts | sed 's/^.*version = "\([^"]*\)".*$/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read the project version from build.gradle.kts"
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::project version $version is a SNAPSHOT: the release PR must flip it (docs/release.md, version-flip checklist)"
              exit 1
              ;;
          esac
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match the project version $version"
            exit 1
          fi
          echo "ok: $TAG matches the project version $version"

      # The newest push run of each required workflow on the tagged commit
      # must have succeeded. A release created right after a merge waits for
      # them (up to an hour) instead of failing.
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=100" \
              --jq '[.workflow_runs | group_by(.path)[] | max_by(.run_number) | {path, status, conclusion}]')
            waiting=0
            for wf in $REQUIRED_WORKFLOWS; do
              run=$(jq -c --arg p "$wf" '.[] | select(.path == $p)' <<< "$runs")
              if [ -z "$run" ]; then
                echo "$wf: no push run on $sha yet"; waiting=1; continue
              fi
              status=$(jq -r .status <<< "$run"); conclusion=$(jq -r .conclusion <<< "$run")
              if [ "$status" != "completed" ]; then
                echo "$wf: $status"; waiting=1
              elif [ "$conclusion" != "success" ]; then
                echo "::error::$wf concluded $conclusion on $sha; fix master and release a new tag"
                exit 1
              else
                echo "ok: $wf success on $sha"
              fi
            done
            [ "$waiting" = "0" ] && exit 0
            sleep 60
          done
          echo "::error::required workflows did not finish on $sha within an hour"
          exit 1

  pre-flight:
    name: Engine artifacts live on Maven Central
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Verify the engine artifacts are live on Maven Central
        run: |
          set -euo pipefail
          version=$(grep -m1 '^guardCore = ' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "could not read the guardCore lockstep version from gradle/libs.versions.toml"
            exit 1
          fi
          for artifact in guard-core-engine guard-core; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/com/guard-core/${artifact}/${version}/${artifact}-${version}.pom" \
              || echo 000)
            if [ "$code" != "200" ]; then
              echo "com.guard-core:${artifact}:${version} is NOT live on Maven Central (HTTP ${code})."
              echo "Engine-before-adapters is a hard ordering rule: run the guard-core-jvm release first"
              echo "(tag, GitHub release, Portal release clicks; see its docs/release.md), then re-drive"
              echo "this workflow."
              exit 1
            fi
            echo "ok: com.guard-core:${artifact}:${version} is live on Maven Central"
          done

  publish:
    name: Publish to Maven Central (Central Portal)
    needs: [verify, pre-flight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Check publishing credentials and GPG inputs are present
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          for secret in CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!secret}" ]; then
              echo "secret ${secret} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Maven Central publishing needs four repository secrets:"
            echo "  CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD  (Portal user token)"
            echo "  GPG_PRIVATE_KEY / GPG_PASSPHRASE                   (armored signing key)"
            echo "Setup: docs/release.md, prerequisites section."
            exit 1
          fi
          echo "ok: all four publishing secrets are present"

      # Changed-only rerun safety: skip when this artifact is already live.
      - name: Check whether this artifact is already on Maven Central
        id: artifact
        run: |
          set -euo pipefail
          version="${TAG#v}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/com/guard-core/guard-agent-jvm/${version}/guard-agent-jvm-${version}.pom" \
            || echo 000)
          case "$code" in
            200)
              echo "com.guard-core:guard-agent-jvm ${version} is already live on Maven Central; nothing to do"
              echo "state=skip" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "com.guard-core:guard-agent-jvm ${version} is not on Maven Central; queued to publish"
              echo "state=publish" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "repo1.maven.org returned HTTP ${code}; refusing to publish against unknown registry state"
              exit 1
              ;;
          esac

      # GUARD_CORE_USE_COMPOSITE=false: no includeBuild; the compile-only
      # facade coordinates resolve from the repositories (mavenLocal, then
      # Maven Central) and the POM stays engine-free.
      - name: Build the guard-agent-jvm staging bundle (no composite)
        if: steps.artifact.outputs.state == 'publish'
        env:
          GUARD_CORE_USE_COMPOSITE: "false"
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishMavenPublicationToCentralStagingRepository --no-daemon

      - name: Upload and validate the guard-agent-jvm deployment
        if: steps.artifact.outputs.state == 'publish'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          token=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 | tr -d '\n')
          rm -f central-bundle.zip
          (cd build/central-staging && zip -qr "$GITHUB_WORKSPACE/central-bundle.zip" .)
          deployment=""
          for _attempt in 1 2 3; do
            response=$(curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${token}" \
              -F "bundle=@central-bundle.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=guard-agent-jvm-${version}&publishingType=USER_MANAGED") \
              && deployment=$(printf '%s' "$response" | tr -d '[:space:]') && break
            echo "upload attempt ${_attempt} failed; retrying in 30s"
            sleep 30
          done
          if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
            echo "guard-agent-jvm upload failed after 3 attempts"
            exit 1
          fi
          echo "guard-agent-jvm deployment: ${deployment}"
          for _ in $(seq 1 30); do
            state=$(curl -sS -X POST \
              -H "Authorization: Bearer ${token}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq -r '.deploymentState' || true)
            echo "validation state: ${state}"
            case "$state" in
              VALIDATED)
                echo "guard-agent-jvm ${version} is VALIDATED; release it from the Portal UI (Deployments)"
                exit 0
                ;;
              PUBLISHED)
                echo "guard-agent-jvm ${version} is PUBLISHED"
                exit 0
                ;;
              FAILED)
                curl -sS -X POST -H "Authorization: Bearer ${token}" \
                  "https://central.sonatype.com/api/v1/publisher/status?id=${deployment}" | jq .
                echo "guard-agent-jvm deployment failed Portal validation"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "validation did not settle in 15 minutes; inspect deployment ${deployment} in the Portal UI, then re-drive this workflow"
          exit 1

      - name: Summary
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "Publish run for guard-agent-jvm ${version} finished. Operator steps:"
          echo "  1. Release the VALIDATED deployment in the Portal UI (central.sonatype.com, Deployments)."
          echo "  2. Verify repo1.maven.org serves com.guard-core:guard-agent-jvm:${version}."
          echo "  3. Run the post-release audits in docs/release.md."
