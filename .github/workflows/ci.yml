name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # TODO: wire gradle/actions/wrapper-validation here once an in-org repo
      # pins a SHA for it; no Guard-Core repo references it yet.

      - name: Checkout engine (guard-core-jvm at the pinned ref)
        run: |
          git clone --depth 1 https://github.com/Guard-Core/guard-core-jvm.git guard-core-jvm
          cd guard-core-jvm
          git fetch --depth 1 origin 5f4ea56
          git checkout 5f4ea56

      # W7 lands the Redis-backed persistence tests; both need Redis (the
      # same service shape the guard-core-jvm CI runs).
      - name: Start Redis
        run: |
          docker run -d --name guard-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec guard-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done

      - name: Build and test
        env:
          REDIS_HOST: 127.0.0.1
        run: ./gradlew build --no-daemon

      - name: Stop Redis
        if: always()
        run: docker rm -f guard-redis || true

  ci:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build job finished with: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All CI jobs passed"
