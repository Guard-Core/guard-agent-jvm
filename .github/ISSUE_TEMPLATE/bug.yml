name: Bug report
description: Guard Agent JVM does not behave as documented
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: value
    attributes:
      label: Value this delivers
      description: One sentence a user could witness once this is fixed.
      placeholder: "Requests with whitelisted IPs are no longer rate limited."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Error messages, stack traces and logs go here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure Guard Agent JVM with '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: guard-agent-jvm version, JDK version, OS.
      placeholder: "guard-agent-jvm 3.2.4, JDK 17, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config with secrets masked.
      render: kotlin
      placeholder: |
        // Minimal setup that reproduces the issue (secrets masked)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Production or development, consistent or intermittent, workarounds tried.
