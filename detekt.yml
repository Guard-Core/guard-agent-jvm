# Minimal overrides on top of detekt's default rule set (buildUponDefaultConfig = true).

build:
  maxIssues: 0

# Overrides driven by the W7 port surface (guard-agent-go sources ported
# file-for-file). Each relaxation names the reason; anything not listed stays
# at detekt's default.
complexity:
  LongMethod:
    # sendBatch/fetchDynamicRules mirror the Go retry loop one-to-one
    # (transport.go:395, dynamic_rules.go); normalize mirrors the Go
    # field-by-field validator (config.go:264).
    threshold: 220
  LongParameterList:
    # SecurityEvent/SecurityMetric mirror the Go wire structs field-for-field
    # (models.go:99); the constructor is the port surface.
    active: false
  CyclomaticComplexMethod:
    # sendBatch is one status-code switch per Go branch (transport.go:445);
    # normalize is one branch per Go config field.
    threshold: 60
  TooManyFunctions:
    # One Kotlin file per Go module keeps the file:line mapping; GuardAgent
    # mirrors agent.go's method set.
    thresholdInFiles: 60
    thresholdInClasses: 80
    thresholdInInterfaces: 60
    thresholdInObjects: 60
  LargeClass:
    # GuardAgent mirrors agent.go (1,146 Go lines) as one struct.
    active: false
  NestedBlockDepth:
    # The encoding/json parser analog and the retry loops port the Go
    # control flow as written.
    threshold: 8
  ComplexCondition:
    # Overflow-wait and gate conditions port the Go select guards as written.
    active: false

exceptions:
  TooGenericExceptionCaught:
    # The Go failure-isolation policy (recoverPanic) ports as broad catches
    # that log and convert to ErrInternal.
    active: false
  SwallowedException:
    # Fail-open persistence paths (persistence.go store/del) port verbatim.
    active: false
  RethrowCaughtException:
    # The RoundTripper panic propagation (transport.go client.Do) ports
    # verbatim.
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  MatchingDeclarationName:
    # Several files mirror one Go module (Models.kt: SecurityEvent +
    # SecurityMetric + EventBatch + the wire writers).
    active: false

empty-blocks:
  EmptyFunctionBlock:
    # The bridge's documented no-ops (initializeRedis) and the fail-open
    # catch arms implement surface-only members.
    active: false

style:
  MagicNumber:
    # Wire constants (thresholds, status codes, base64/GCM sizes) are the
    # port surface; renaming them to named constants would break the
    # guard-agent-go file:line parity.
    active: false
  UseRequire:
    # Go `errors.New(...)` guards port as exception throws.
    active: false
  UseCheckOrError:
    active: false
  MaxLineLength:
    # Warning messages stay byte-exact with the Go originals.
    maxLineLength: 220
  LoopWithTooManyJumpStatements:
    # Retry loops port the Go continue structure.
    active: false
  ReturnCount:
    # sendBatch returns per Go status branch.
    active: false
  ThrowsCount:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateMember:
    active: false
  ProtectedMemberInFinalClass:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  UnusedPrivateProperty:
    active: false

performance:
  SpreadOperator:
    # go-redis varargs ports: client.Del(ctx, keys...) via Lettuce spread.
    active: false
