# osv-scanner configuration (the dependency-audit CI job and the weekly
# scheduled scan read this via --config).
#
# Suppression discipline (spec 14): entries are per-advisory, each with a
# reason, and each names its removal trigger. Nothing is disabled wholesale.
# When the triggering dependency moves, delete the matching entries in the
# same PR - the audit must fail again the moment a suppression is stale.

# io.netty 4.1.125.Final is the transitive graph of io.lettuce:lettuce-core
# 6.8.2.RELEASE, the agent's pinned Redis persistence client. Guard usage
# connects Lettuce to a single user-configured Redis endpoint, so the
# affected netty surfaces (SniHandler traversal, compressed-decode paths,
# DNS-resolver spoofing) are not attacker-reachable in this deployment shape.
# The lettuce 6.8.2 upgrade cleared GHSA-3p8m-j85q-pgmj only; each entry
# below goes once a lettuce upgrade brings a fixed netty.

[[IgnoredVulns]]
